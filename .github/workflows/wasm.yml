name: WebAssembly
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    env:
      KAPSULE_RUST_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-emscripten
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          python3 "$RUNNER_TEMP/emsdk/emsdk.py" install 4.0.23
          python3 "$RUNNER_TEMP/emsdk/emsdk.py" activate 4.0.23
      - name: Build and test the WASM runtime
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 tools/build_wasm.py
          node tools/test_store.mjs
          node tools/test_wasm.mjs
          node tools/test_worker.mjs
          python3 tools/test_security.py
          python3 tools/test_publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: kapsule-web
          path: dist/web/
          if-no-files-found: error
          include-hidden-files: true
